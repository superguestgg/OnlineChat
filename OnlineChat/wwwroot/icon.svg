<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="message" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="50%" stop-color="#4F46E5"/>
            <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
    </defs>

    <!-- White background -->
    <rect
            width="64"
            height="64"
            rx="16"
            fill="white"
    />

    <!-- Wide and shorter speech bubble -->
    <path
            d="M6 19
           C6 14 10 10 15 10
           H49
           C54 10 58 14 58 19
           V39
           C58 44 54 48 49 48
           H29
           L16 56
           L19 48
           H15
           C10 48 6 44 6 39
           Z"
