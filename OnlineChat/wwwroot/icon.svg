    />

    <!-- Larger white WS -->
    <text
            x="32"
            y="40"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="30"
            font-weight="900"
            letter-spacing="-2.5"
            fill="white"
    >WS</text>
</svg>